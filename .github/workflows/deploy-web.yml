name: Deploy web app

# Publishes the web/ folder to GitHub Pages. No build step — it is plain
# HTML/CSS/JS, so the files are uploaded as they are.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# After that every push to main republishes, and the site lives at
#   https://<user>.github.io/<repo>/

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the JavaScript parses
        run: |
          for f in web/*.js; do node --check "$f"; done

      - name: Load the page headlessly and exercise it
        # A ReferenceError early in app.js aborts the whole script: no event
        # handlers attach and every button silently does nothing, while the
        # page still looks almost right. Parsing alone does not catch that,
        # so the page is actually loaded and driven here.
        run: |
          npm install jsdom --no-audit --no-fund --silent
          node web/test/load.test.js
          node web/test/smoke.test.js
          node web/test/cube.test.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
