name: Deploy web app

# Publishes the web/ folder to GitHub Pages. No build step — it is plain
# HTML/CSS/JS, so the files are uploaded as they are.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# After that every push to main republishes, and the site lives at
#   https://<user>.github.io/<repo>/

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the JavaScript
        run: node --check web/app.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
