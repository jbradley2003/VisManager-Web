name: Build VisManager

# Builds real Windows and macOS binaries on real runners.
#
# PyInstaller does NOT cross-compile: it bundles the interpreter and
# libraries of whatever OS it runs on. A macOS build is a Mach-O binary and
# cannot run under Wine, which is a loader for Windows PE executables.
# The only way to get a .exe is to build on Windows — this does that for you
# without needing a Windows machine.
#
# Usage:
#   1. Push this repo to GitHub (the free tier includes these runners).
#   2. Actions tab -> "Build VisManager" -> Run workflow.
#   3. Download the artifacts when it finishes (~3 minutes).

on:
  workflow_dispatch:        # manual "Run workflow" button
    inputs:
      cube3d:
        description: "Include 3D .cube support (VTK). Much larger download."
        type: boolean
        default: false
  push:
    tags:
      - 'v*'                # also build on version tags

jobs:
  windows:
    name: Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install VTK (only when 3D is requested)
        if: inputs.cube3d
        run: python -m pip install vtk

      - name: Enable 3D in the spec
        if: inputs.cube3d
        shell: pwsh
        run: |
          (Get-Content vismanager.spec) `
            -replace 'INCLUDE_CUBE3D = False', 'INCLUDE_CUBE3D = True' `
            | Set-Content vismanager.spec
          Write-Host "3D cube support enabled for this build"

      - name: Build
        run: python -m PyInstaller vismanager.spec --clean --noconfirm

      - name: Verify the exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist\VisManager.exe)) {
            Write-Error "dist\VisManager.exe was not produced"
            exit 1
          }
          Get-Item dist\VisManager.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: VisManager-windows${{ inputs.cube3d && '-3d' || '' }}
          path: dist/VisManager.exe
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install VTK and enable 3D (only when requested)
        if: inputs.cube3d
        run: |
          python -m pip install vtk
          sed -i '' 's/INCLUDE_CUBE3D = False/INCLUDE_CUBE3D = True/' vismanager.spec

      - name: Build
        run: python -m PyInstaller vismanager.spec --clean --noconfirm

      - name: Package
        run: |
          cd dist
          zip -r VisManager-macos.zip VisManager* 

      - uses: actions/upload-artifact@v4
        with:
          name: VisManager-macos${{ inputs.cube3d && '-3d' || '' }}
          path: dist/VisManager-macos.zip
          if-no-files-found: error
